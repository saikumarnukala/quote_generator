name: Infotainment Video Automation

on:
  schedule:
    # Run daily at 13:00 UTC (6:30 PM IST / 9:00 AM EDT / 2:00 PM BST)
    # Globally recognized peak engagement window for YouTube Shorts
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific topic (leave empty for automatic selection)'
        required: false
        default: ''
      category:
        description: 'Infotainment Category'
        required: false
        default: 'science'
        type: choice
        options:
          - science
          - technology
          - space
          - history
          - ai
          - geography
          - engineering
          - everyday_science
          - interesting_facts
          - natural_phenomena
      scenes:
        description: 'Number of scenes (default: 4)'
        required: false
        default: '4'
      privacy:
        description: 'YouTube upload privacy status'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      dry_run:
        description: 'Simulate without consuming external paid upload quota'
        required: false
        type: boolean
        default: false
      upload:
        description: 'Enable YouTube upload'
        required: false
        type: boolean
        default: true
      upload_instagram:
        description: 'Enable Instagram Reels upload (currently off)'
        required: false
        type: boolean
        default: false
      upload_all:
        description: 'Enable both YouTube and Instagram Reels upload'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-generate:
    name: Generate Infotainment Video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg + fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto \
            fonts-dejavu-core
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Run automated unit tests
        run: |
          python -m unittest discover tests

      - name: Generate Infotainment Video
        env:
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY:       ${{ secrets.DEEPGRAM_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:        ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:           ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:       ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:       ${{ secrets.YT_REFRESH_TOKEN }}
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "schedule" ]; then
            echo "=========================================================="
            echo "  AUTOMATED DAILY PRODUCTION RUN (PUBLIC YOUTUBE SHORTS)  "
            echo "=========================================================="
            python main.py --scenes 4 --upload --privacy public
          else
            echo "=========================================================="
            echo "  MANUAL WORKFLOW RUN                                    "
            echo "=========================================================="
            TOPIC="${{ github.event.inputs.topic }}"
            CATEGORY="${{ github.event.inputs.category || 'science' }}"
            SCENES="${{ github.event.inputs.scenes || '4' }}"
            PRIVACY="${{ github.event.inputs.privacy || 'public' }}"
            EXTRA_ARGS=""

            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --dry-run"
            fi

            if [ "${{ github.event.inputs.upload_all }}" = "true" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --upload-all --privacy $PRIVACY"
            elif [ "${{ github.event.inputs.upload }}" = "true" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --upload --privacy $PRIVACY"
            elif [ "${{ github.event.inputs.upload_instagram }}" = "true" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --upload-instagram"
            fi

            if [ -n "$TOPIC" ]; then
              python main.py "$TOPIC" --category "$CATEGORY" --scenes "$SCENES" $EXTRA_ARGS
            else
              python main.py --category "$CATEGORY" --scenes "$SCENES" $EXTRA_ARGS
            fi
          fi

      - name: Commit updated run history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          if [ -f data/history.json ]; then
            git add data/history.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update topic and asset history [skip ci]"
              git pull --rebase --autostash origin main || true
              git push origin HEAD || true
            else
              echo "No history changes to commit."
            fi
          fi

      - name: Upload output video & metadata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-infotainment-videos
          path: |
            output/*.mp4
            output/*_thumb.jpg
            output/*_metadata.json
          if-no-files-found: ignore
          retention-days: 7
